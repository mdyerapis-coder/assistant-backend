[project]
name = "assistant-backend"
version = "0.1.0"
description = "Backend for a personal-assistant app (placeholder name) — OpenAI-backed chat with tool-calling for reminders, calendar, and email."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "aiosqlite>=0.20",
    "openai>=1.50",
    "cryptography>=43",
    "google-auth>=2.57.0",
    "google-auth-oauthlib>=1.2",
    "requests>=2.34.2",
    "firebase-admin>=7.5.0",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
